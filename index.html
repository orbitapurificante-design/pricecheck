<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PriceCheck</title>
<meta name="theme-color" content="#1a2340">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#e4e7ec;--navy:#1a2340;--s2:#1e2a4a;--gold:#c9a84c;--ok:#10b981;--bad:#ef4444;--txt:#f1f5f9;--mut:#7a8fba;--ink:#1a2340;--card:#fff;--line:#d5dae3}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--navy);padding:10px 14px 12px;border-bottom:1px solid rgba(201,168,76,.25)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo{font-size:19px;font-weight:800;color:var(--txt)}.logo span{color:var(--gold)}
.sync{margin-left:auto;font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.ok{background:var(--ok)}.dot.off{background:var(--bad)}
.rf{background:none;border:1px solid rgba(255,255,255,.18);color:var(--txt);border-radius:8px;padding:4px 9px;font-size:13px;cursor:pointer}
#q{width:100%;padding:11px 13px;border-radius:10px;border:0;font-size:15px;background:#fff;color:var(--ink);outline:none}
main{padding:104px 10px 24px;max-width:720px;margin:0 auto}
.fam{background:var(--navy);color:var(--gold);font-weight:700;font-size:12px;letter-spacing:.4px;text-transform:uppercase;padding:9px 12px;border-radius:8px;margin:10px 0 6px;cursor:pointer;display:flex;justify-content:space-between}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.row:active{background:#f1f3f7}
.ico{width:42px;height:42px;border-radius:8px;background:#eef0f5;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.inf{flex:1;min-width:0}
.nm{font-size:14px;font-weight:600;line-height:1.25}
.cd{font-size:11px;color:#6b7690;margin-top:2px;font-family:ui-monospace,Menlo,monospace}
.pr{text-align:right;flex-shrink:0}
.pv{font-size:16px;font-weight:800;font-family:ui-monospace,Menlo,monospace}
.pn{font-size:10px;color:#6b7690}
.empty{text-align:center;color:#6b7690;padding:48px 16px;font-size:14px}
.more{display:block;width:100%;padding:12px;margin:8px 0;border:0;border-radius:10px;background:var(--navy);color:var(--gold);font-weight:700;font-size:13px}
.bg{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);align-items:flex-end}
.bg.open{display:flex}
.card{width:100%;max-width:720px;margin:0 auto;background:var(--navy);color:var(--txt);border-radius:20px 20px 0 0;padding:16px 16px 26px;max-height:88vh;overflow-y:auto}
.hd{width:32px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 14px}
.mc{font-size:11px;color:var(--mut);font-family:ui-monospace,Menlo,monospace}
.mn{font-size:18px;font-weight:700;line-height:1.2;margin:4px 0}
.mt{font-size:11px;color:var(--mut);margin-bottom:14px}
.lbl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:8px}
.fr{display:flex;justify-content:space-between;align-items:center;background:var(--s2);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:10px 12px;margin-bottom:5px}
.fr.best{border-color:rgba(16,185,129,.5)}
.fn{font-size:13px;font-weight:600}.fd{font-size:10px;color:var(--mut);margin-top:2px}
.fp{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700}
.fr.best .fp{color:var(--ok)}
.cl{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:var(--gold);color:var(--ink);font-weight:700;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="top"><div class="logo">Price<span>Check</span></div>
    <div class="sync"><span class="dot" id="dot"></span><span id="st">…</span><button class="rf" onclick="atualizar(false)">↻</button></div></div>
  <input id="q" type="search" placeholder="Pesquisar produto, código ou EAN…" oninput="LIM=100;render()">
</header>
<main id="lista"></main>
<div class="bg" id="bg" onclick="if(event.target===this)fechar()"><div class="card" id="mc"></div></div>

<script>
// ══ CONFIGURAÇÃO — mesmos ficheiros que a app de administração grava no GitHub ══
const BASE='https://raw.githubusercontent.com/orbitapurificante-design/pricecheck/main/';
const URL_PRECOS=BASE+'dados-precos.json', URL_PROD=BASE+'produtos.xlsx';
const OUTROS='Outros';

let DADOS=[],FORN={},PRECOS={},LIM=100,FECHADAS=new Set();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const semAc=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

// ══ CACHE LOCAL (só para abrir mais depressa/offline; se o Chrome for limpo, volta a descarregar do GitHub) ══
function cacheGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function cacheSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// ══ PRODUTOS (produtos.xlsx) ══
function lerProdutos(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).slice(1);
  return rows.map((r,i)=>({id:i,cod:String(r[0]||'').trim(),ean:String(r[1]||'').trim(),
    nome:String(r[2]||r[1]||r[0]||'').trim(),un:String(r[5]||r[6]||'').trim(),
    cat:String(r[8]||'GERAL').toUpperCase().trim(),f:String(r[10]||'').trim()})).filter(p=>p.nome);
}

// ══ FORNECEDORES: só os "incluídos" (melhor===true) mantêm o nome; os outros viram "Outros" ══
const PREF=['arcol','antonioteixeiralopes','teixeiralopes','recheio','novocash','bisquidoce'];
function preparar(data){
  const lista=data.fornecedores||[];
  const semFlags=lista.length&&lista.every(f=>f.melhor===undefined);
  const out={};
  lista.forEach(f=>{
    const n=semAc(f.nome).replace(/[^a-z0-9]/g,'');
    const incl=semFlags?(n==='atl'||PREF.some(k=>n.includes(k))):f.melhor===true;
    out[String(f.id)]=incl?f.nome:OUTROS;
  });
  return out;
}

// ══ PREÇOS ══
function dataMs(str){const m=String(str||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);return m?new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)).getTime():0;}
function codChave(p){return [p.cod,p.ean,p.f].map(c=>String(c||'').trim()).filter(c=>c.length>1);}
function entradasDoProduto(p){
  for(const c of codChave(p)){if(PRECOS[c])return PRECOS[c];}
  for(const c of codChave(p)){const n=norm(c);const k=Object.keys(PRECOS).find(x=>norm(x)===n||norm(x).replace(/^0+/,'')===n.replace(/^0+/,''));if(k)return PRECOS[k];}
  return null;
}
// devolve [{nome,preco,data}] — um por fornecedor visível; todos os ocultos juntos em "Outros" (o mais barato)
function precosVisiveis(p){
  const pf=entradasDoProduto(p);if(!pf)return[];
  const agora=Date.now(),porNome={};
  Object.keys(pf).forEach(fid=>{
    const nome=FORN[fid];if(!nome)return;
    const h=pf[fid]||[];let ult=null;
    for(let i=h.length-1;i>=0;i--){
      const e=h[i],preco=parseFloat(e.preco);if(isNaN(preco)||preco<0)continue;
      const t=dataMs(e.data);
      if(e.promo&&(!t||(agora-t)/864e5>15))continue;   // promoção caducada (15 dias)
      ult={preco,data:e.data,t};break;
    }
    if(!ult)return;
    const c=porNome[nome];
    if(!c||ult.preco<c.preco)porNome[nome]={nome,preco:ult.preco,data:ult.data};
  });
  return Object.values(porNome).sort((a,b)=>(a.nome===OUTROS)-(b.nome===OUTROS)||a.preco-b.preco);
}

// ══ ECRÃ ══
function render(){
  const c=document.getElementById('lista');
  if(!DADOS.length){c.innerHTML='<div class="empty">A carregar produtos…</div>';return;}
  const b=semAc(document.getElementById('q').value.trim());
  const filt=b?DADOS.filter(p=>semAc(p.nome).includes(b)||p.cod.toLowerCase().includes(b)||p.ean.includes(b)||p.f.toLowerCase().includes(b)):DADOS;
  if(!filt.length){c.innerHTML='<div class="empty">Sem resultados</div>';return;}
  const cats=[...new Set(filt.map(p=>p.cat))].sort();
  let html='',n=0,corte=false;
  cats.forEach(cat=>{
    const ps=filt.filter(p=>p.cat===cat);
    const aberta=b?true:FECHADAS.has(cat)===false;
    html+=`<div class="fam" onclick="toggleFam(this.dataset.c)" data-c="${esc(cat)}"><span>${aberta?'▼':'▶'} ${esc(cat)}</span><span>${ps.length}</span></div>`;
    if(!aberta)return;
    ps.forEach(p=>{
      if(n++>=LIM){corte=true;return;}
      const v=precosVisiveis(p),min=v.length?Math.min(...v.map(x=>x.preco)):null;
      html+=`<div class="row" onclick="abrir(${p.id})"><div class="ico">📦</div>
        <div class="inf"><div class="nm">${esc(p.nome)}</div><div class="cd">${esc(p.cod||p.ean)}${p.un?' · '+esc(p.un):''}</div></div>
        <div class="pr"><div class="pv">${min!=null?min.toFixed(2)+'€':'—'}</div><div class="pn">${v.length?v.length+' preço(s)':'sem preço'}</div></div></div>`;
    });
  });
  if(corte)html+='<button class="more" onclick="LIM+=100;render()">Mostrar mais…</button>';
  c.innerHTML=html;
}
function toggleFam(c){FECHADAS.has(c)?FECHADAS.delete(c):FECHADAS.add(c);render();}
function abrir(id){
  const p=DADOS.find(x=>x.id===id);if(!p)return;
  const v=precosVisiveis(p);
  const rows=v.length?v.map((e,i)=>`<div class="fr${i===0&&v.length>1?' best':''}"><div><div class="fn">${i===0&&v.length>1?'🥇 ':''}${esc(e.nome)}</div><div class="fd">📅 ${esc(String(e.data||'').split(' ')[0])}</div></div><div class="fp">${e.preco.toFixed(2)}€</div></div>`).join(''):'<div class="empty" style="padding:18px">Sem preços registados</div>';
  document.getElementById('mc').innerHTML=`<div class="hd"></div><div class="mc">${esc(p.cod||p.ean)}</div><div class="mn">${esc(p.nome)}</div><div class="mt">${esc(p.cat)}${p.un?' · '+esc(p.un):''}</div><div class="lbl">Preços</div>${rows}<button class="cl" onclick="fechar()">Fechar</button>`;
  document.getElementById('bg').classList.add('open');
}
function fechar(){document.getElementById('bg').classList.remove('open');}

// ══ ESTADO / SINCRONIZAÇÃO ══
function estado(txt,cls){document.getElementById('st').textContent=txt;document.getElementById('dot').className='dot '+(cls||'');}
function aplicarPrecos(data){PRECOS=data.precos||{};FORN=preparar(data);}
async function atualizar(silencioso){
  if(!navigator.onLine){estado('Offline','off');return;}
  estado('A atualizar…','');
  try{
    const [rp,rx]=await Promise.all([fetch(URL_PRECOS+'?t='+Date.now(),{cache:'no-store'}),fetch(URL_PROD+'?t='+Date.now(),{cache:'no-store'})]);
    if(!rp.ok)throw new Error('preços '+rp.status);
    const data=await rp.json();
    // guarda na cache só o necessário, já com os nomes ocultos
    aplicarPrecos(data);cacheSet('PCV_DATA',{precos:PRECOS,forn:FORN});
    if(rx.ok){DADOS=lerProdutos(new Uint8Array(await rx.arrayBuffer()));cacheSet('PCV_PROD',DADOS);}
    cacheSet('PCV_TS',new Date().toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}));
    estado('Atualizado '+cacheGet('PCV_TS'),'ok');render();
  }catch(e){
    estado(DADOS.length?'Sem ligação (dados guardados)':'Erro: '+e.message,'off');render();
  }
}
(function init(){
  const d=cacheGet('PCV_DATA'),p=cacheGet('PCV_PROD');
  if(d){PRECOS=d.precos||{};FORN=d.forn||{};}
  if(p)DADOS=p;
  if(DADOS.length){estado(cacheGet('PCV_TS')?'Guardado '+cacheGet('PCV_TS'):'Guardado','');}
  render();atualizar(true);
})();
window.addEventListener('online',()=>atualizar(true));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')atualizar(true);});
</script>
</body>
</html>
